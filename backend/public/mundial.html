<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mundial 2026 · Bracket</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0a0e1a;
      --bg2: #0f1525;
      --bg3: #141929;
      --card: #111827;
      --border: rgba(255,255,255,.06);
      --border2: rgba(108,172,228,.3);
      --text: #e8eaf2;
      --text2: rgba(255,255,255,.5);
      --text3: rgba(255,255,255,.22);
      --accent: #6CACE4;
      --amber: #FFB81C;
      --green: #3ae8b0;
      --red: #ff5b6a;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      min-height: 100vh;
    }

    /* ── HEADER ──────────────────────────────────── */
    .page-header {
      background: linear-gradient(135deg, #060d1f 0%, #0f2347 50%, #060d1f 100%);
      border-bottom: 1px solid rgba(108,172,228,.15);
      padding: 18px 24px 14px;
      display: flex;
      align-items: center;
      gap: 16px;
      position: relative;
      overflow: hidden;
    }
    .page-header::before {
      content:'';
      position:absolute;
      inset:0;
      background: radial-gradient(ellipse 60% 100% at 50% 0%, rgba(108,172,228,.08) 0%, transparent 70%);
      pointer-events:none;
    }
    .trophy-wrap {
      width: 48px; height: 48px;
      background: radial-gradient(circle, rgba(255,184,28,.18) 0%, rgba(255,184,28,.04) 70%);
      border: 1px solid rgba(255,184,28,.25);
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 24px;
      flex-shrink: 0;
      animation: glow 2.5s ease-in-out infinite;
    }
    @keyframes glow {
      0%,100% { box-shadow: 0 0 0 0 rgba(255,184,28,0); }
      50%      { box-shadow: 0 0 18px 4px rgba(255,184,28,.2); }
    }
    .header-text .title {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 1.7rem;
      letter-spacing: .06em;
      color: #fff;
      line-height: 1;
    }
    .header-text .subtitle {
      font-size: .68rem;
      color: var(--text2);
      letter-spacing: .12em;
      text-transform: uppercase;
      margin-top: 3px;
    }
    .header-badge {
      margin-left: auto;
      background: rgba(108,172,228,.1);
      border: 1px solid rgba(108,172,228,.2);
      border-radius: 20px;
      padding: 4px 12px;
      font-size: .68rem;
      color: var(--accent);
      letter-spacing: .08em;
      text-transform: uppercase;
      font-weight: 700;
    }

    /* ── STATS BAR ───────────────────────────────── */
    .stats-bar {
      display: flex;
      gap: 1px;
      background: var(--border);
      border-bottom: 1px solid var(--border);
    }
    .stat-item {
      flex: 1;
      background: var(--bg2);
      padding: 10px 16px;
      text-align: center;
    }
    .stat-val {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 1.3rem;
      color: var(--amber);
      letter-spacing: .04em;
    }
    .stat-lbl {
      font-size: .6rem;
      color: var(--text3);
      text-transform: uppercase;
      letter-spacing: .1em;
      margin-top: 1px;
    }

    /* ── BRACKET AREA ────────────────────────────── */
    .bracket-container {
      padding: 20px 16px;
      overflow-x: auto;
    }

    /* ── ROUND LABELS ────────────────────────────── */
    .round-labels {
      display: flex;
      padding: 0 16px 0;
      margin-bottom: -4px;
    }
    .rl { font-size: .62rem; color: var(--text3); text-transform: uppercase; letter-spacing: .1em; font-weight: 700; }

    /* ── SVG BRACKET ─────────────────────────────── */
    .bracket-svg { display: block; }

    .team-box { cursor: pointer; }
    .team-box rect { transition: fill .15s; }
    .team-box:hover rect { fill: rgba(108,172,228,.15) !important; }

    /* ── MODAL ───────────────────────────────────── */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.75);
      backdrop-filter: blur(4px);
      z-index: 200;
      align-items: center;
      justify-content: center;
    }
    .modal-overlay.open { display: flex; }
    .modal-box {
      background: #131724;
      border: 1px solid rgba(108,172,228,.2);
      border-radius: 14px;
      padding: 22px;
      width: 300px;
      animation: slideUp .18s ease;
    }
    @keyframes slideUp {
      from { opacity:0; transform:translateY(12px); }
      to   { opacity:1; transform:translateY(0); }
    }
    .modal-header {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 16px;
    }
    .modal-title { font-size: .92rem; font-weight: 700; color: #fff; }
    .modal-close {
      width: 24px; height: 24px;
      background: rgba(255,255,255,.07);
      border: none;
      border-radius: 6px;
      color: var(--text2);
      cursor: pointer;
      font-size: 14px;
      display: flex; align-items: center; justify-content: center;
      font-family: inherit;
    }
    .modal-close:hover { background: rgba(255,255,255,.12); }
    .mf { margin-bottom: 10px; }
    .mf label { font-size: .68rem; color: var(--text2); display: block; margin-bottom: 4px; letter-spacing: .05em; }
    .mf input {
      width: 100%;
      background: #1a1f30;
      border: 1px solid rgba(255,255,255,.1);
      border-radius: 8px;
      padding: 8px 10px;
      color: #fff;
      font-size: .82rem;
      outline: none;
      font-family: 'DM Sans', sans-serif;
      transition: border-color .15s;
    }
    .mf input:focus { border-color: var(--accent); }
    .mbtns { display: flex; gap: 8px; justify-content: flex-end; margin-top: 16px; }
    .mbtn {
      padding: 8px 16px;
      border-radius: 8px;
      border: none;
      font-size: .8rem;
      font-weight: 600;
      cursor: pointer;
      font-family: 'DM Sans', sans-serif;
      transition: opacity .15s;
    }
    .mbtn:hover { opacity: .85; }
    .mbtn-a { background: var(--accent); color: #fff; }
    .mbtn-o { background: rgba(255,255,255,.07); color: var(--text2); border: 1px solid rgba(255,255,255,.1); }

    /* ── TOAST ───────────────────────────────────── */
    .toast {
      position: fixed;
      bottom: 24px; left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: #1e2a40;
      border: 1px solid rgba(108,172,228,.3);
      border-radius: 10px;
      padding: 10px 20px;
      font-size: .8rem;
      color: var(--accent);
      font-weight: 600;
      opacity: 0;
      transition: all .25s;
      pointer-events: none;
      z-index: 300;
      white-space: nowrap;
    }
    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* ── LEGEND ──────────────────────────────────── */
    .legend {
      display: flex;
      gap: 16px;
      padding: 0 16px 16px;
      flex-wrap: wrap;
    }
    .legend-item {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: .65rem;
      color: var(--text3);
      text-transform: uppercase;
      letter-spacing: .08em;
    }
    .legend-dot {
      width: 8px; height: 8px;
      border-radius: 2px;
      flex-shrink: 0;
    }
  </style>
</head>
<body>

  <!-- HEADER -->
  <div class="page-header">
    <div class="trophy-wrap">🏆</div>
    <div class="header-text">
      <div class="title">Mundial 2026</div>
      <div class="subtitle">USA · México · Canadá · 16avos de Final</div>
    </div>
    <div class="header-badge">En vivo</div>
  </div>

  <!-- STATS BAR -->
  <div class="stats-bar">
    <div class="stat-item">
      <div class="stat-val" id="st-partidos">16</div>
      <div class="stat-lbl">Partidos</div>
    </div>
    <div class="stat-item">
      <div class="stat-val" id="st-jugados">0</div>
      <div class="stat-lbl">Jugados</div>
    </div>
    <div class="stat-item">
      <div class="stat-val" id="st-goles">0</div>
      <div class="stat-lbl">Goles</div>
    </div>
    <div class="stat-item">
      <div class="stat-val">19 Jul</div>
      <div class="stat-lbl">Gran Final</div>
    </div>
  </div>

  <!-- BRACKET -->
  <div class="bracket-container">
    <svg class="bracket-svg" id="bsvg" xmlns="http://www.w3.org/2000/svg"></svg>
  </div>

  <!-- LEGEND -->
  <div class="legend">
    <div class="legend-item"><div class="legend-dot" style="background:rgba(255,184,28,.6)"></div>Ganador</div>
    <div class="legend-item"><div class="legend-dot" style="background:rgba(255,255,255,.2)"></div>Perdedor</div>
    <div class="legend-item"><div class="legend-dot" style="background:rgba(108,172,228,.3)"></div>Por jugar</div>
    <div class="legend-item" style="margin-left:auto;color:rgba(255,255,255,.3)">Toca un equipo para editar</div>
  </div>

  <!-- MODAL -->
  <div class="modal-overlay" id="modal">
    <div class="modal-box">
      <div class="modal-header">
        <div class="modal-title">Editar equipo</div>
        <button class="modal-close" onclick="closeModal()">✕</button>
      </div>
      <div class="mf"><label>Bandera (emoji)</label><input id="mFlag" maxlength="4" placeholder="🇦🇷"></div>
      <div class="mf"><label>Equipo</label><input id="mName" placeholder="Argentina"></div>
      <div class="mf"><label>Goles <span style="opacity:.4">(dejar vacío si no jugó)</span></label><input id="mScore" type="number" min="0" max="20" placeholder="—"></div>
      <div class="mbtns">
        <button class="mbtn mbtn-o" onclick="closeModal()">Cancelar</button>
        <button class="mbtn mbtn-a" onclick="saveModal()">Guardar</button>
      </div>
    </div>
  </div>

  <!-- TOAST -->
  <div class="toast" id="toast"></div>

<script>
const W = 104, H = 36, GAP = 12;
const COL_W = 120;
const LINE_COLOR = 'rgba(108,172,228,.2)';
const AMBER = '#FFB81C';
const ACCENT = '#6CACE4';
const FONT = "'DM Sans', system-ui, sans-serif";

const STORAGE_KEY = 'mundial2026_bracket';

const defaultMatches = [
  {id:1,  home:{f:'🏳️',n:'1E'},      away:{f:'🏳️',n:'3 ABCDF'}, date:'27 Jun', hs:null, as:null},
  {id:2,  home:{f:'🏳️',n:'1I'},      away:{f:'🏳️',n:'3 CDFGH'}, date:'27 Jun', hs:null, as:null},
  {id:3,  home:{f:'🏳️',n:'2A'},      away:{f:'🏳️',n:'2B'},      date:'28 Jun', hs:null, as:null},
  {id:4,  home:{f:'🏳️',n:'1F'},      away:{f:'🏳️',n:'2C'},      date:'28 Jun', hs:null, as:null},
  {id:5,  home:{f:'🏳️',n:'2K'},      away:{f:'🏳️',n:'2L'},      date:'29 Jun', hs:null, as:null},
  {id:6,  home:{f:'🏳️',n:'1H'},      away:{f:'🏳️',n:'2J'},      date:'29 Jun', hs:null, as:null},
  {id:7,  home:{f:'🏳️',n:'1D'},      away:{f:'🏳️',n:'3 BEFIJ'}, date:'30 Jun', hs:null, as:null},
  {id:8,  home:{f:'🏳️',n:'1G'},      away:{f:'🏳️',n:'3 AEHIJ'}, date:'30 Jun', hs:null, as:null},
  {id:9,  home:{f:'🏳️',n:'1C'},      away:{f:'🏳️',n:'2F'},      date:'1 Jul',  hs:null, as:null},
  {id:10, home:{f:'🏳️',n:'2E'},      away:{f:'🏳️',n:'2I'},      date:'1 Jul',  hs:null, as:null},
  {id:11, home:{f:'🏳️',n:'1A'},      away:{f:'🏳️',n:'3 CEFHI'}, date:'2 Jul',  hs:null, as:null},
  {id:12, home:{f:'🏳️',n:'1L'},      away:{f:'🏳️',n:'3 EHIJK'}, date:'2 Jul',  hs:null, as:null},
  {id:13, home:{f:'🏳️',n:'1J'},      away:{f:'🏳️',n:'2H'},      date:'3 Jul',  hs:null, as:null},
  {id:14, home:{f:'🏳️',n:'2D'},      away:{f:'🏳️',n:'2G'},      date:'3 Jul',  hs:null, as:null},
  {id:15, home:{f:'🏳️',n:'1B'},      away:{f:'🏳️',n:'3 EFGIJ'}, date:'4 Jul',  hs:null, as:null},
  {id:16, home:{f:'🏳️',n:'1K'},      away:{f:'🏳️',n:'3 DEIJL'}, date:'4 Jul',  hs:null, as:null},
];

let matches;
try {
  const saved = localStorage.getItem(STORAGE_KEY);
  matches = saved ? JSON.parse(saved) : JSON.parse(JSON.stringify(defaultMatches));
} catch(e) {
  matches = JSON.parse(JSON.stringify(defaultMatches));
}

function saveToStorage() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(matches)); } catch(e) {}
}

const leftIds  = [1,2,3,4,5,6,7,8];
const rightIds = [9,10,11,12,13,14,15,16];

let editTarget = null;

function getWinner(m) {
  if (m.hs === null || m.as === null) return null;
  return m.hs > m.as ? 'home' : m.hs < m.as ? 'away' : null;
}

function truncate(s, max) {
  return s.length > max ? s.slice(0, max - 1) + '…' : s;
}

function svgEl(tag, attrs) {
  const el = document.createElementNS('http://www.w3.org/2000/svg', tag);
  for (const [k,v] of Object.entries(attrs)) el.setAttribute(k, v);
  return el;
}

function drawMatch(svg, m, x, y) {
  const winner = getWinner(m);
  const mx = Math.round(x), my = Math.round(y);
  const mh2 = H * 2 + 1;

  const g = svgEl('g', {});

  // shadow
  g.appendChild(svgEl('rect', {
    x: mx+1, y: my+2, width: W, height: mh2, rx: '7',
    fill: 'rgba(0,0,0,.35)'
  }));

  // card bg
  g.appendChild(svgEl('rect', {
    x: mx, y: my, width: W, height: mh2, rx: '7',
    fill: '#0d1b38',
    stroke: winner ? 'rgba(255,184,28,.25)' : 'rgba(255,255,255,.07)',
    'stroke-width': '1'
  }));

  // divider
  g.appendChild(svgEl('line', {
    x1: mx+1, y1: my+H, x2: mx+W-1, y2: my+H,
    stroke: 'rgba(255,255,255,.05)', 'stroke-width': '1'
  }));

  [
    {team: m.home, score: m.hs, side: 'home', wy: my + H/2},
    {team: m.away, score: m.as, side: 'away', wy: my + H + H/2},
  ].forEach(({team, score, side, wy}) => {
    const isW = winner === side;
    const isL = winner && winner !== side;

    const tr = svgEl('g', {class: 'team-box', 'data-id': m.id, 'data-side': side});

    // winner highlight bar
    if (isW) {
      tr.appendChild(svgEl('rect', {
        x: mx, y: wy - H/2,
        width: W, height: H,
        rx: side === 'home' ? '7' : '0',
        fill: 'rgba(255,184,28,.07)'
      }));
      // left accent
      tr.appendChild(svgEl('rect', {
        x: mx, y: wy - H/2,
        width: 3, height: H,
        rx: '2',
        fill: 'rgba(255,184,28,.6)'
      }));
    } else {
      tr.appendChild(svgEl('rect', {
        x: mx, y: wy - H/2, width: W, height: H,
        rx: side === 'home' ? '7' : '0', fill: 'rgba(0,0,0,0)'
      }));
    }

    // flag
    const flagT = svgEl('text', {x: mx+9, y: wy+5, 'font-size': '12'});
    flagT.textContent = team.f;
    tr.appendChild(flagT);

    // name
    const nameT = svgEl('text', {
      x: mx+27, y: wy+5,
      'font-size': '10', 'font-family': FONT,
      'font-weight': isW ? '700' : '400',
      fill: isW ? AMBER : isL ? 'rgba(255,255,255,.25)' : 'rgba(255,255,255,.8)'
    });
    nameT.textContent = truncate(team.n, 9);
    tr.appendChild(nameT);

    // score badge
    if (score !== null) {
      tr.appendChild(svgEl('rect', {
        x: mx + W - 22, y: wy - 9,
        width: 18, height: 17, rx: '4',
        fill: isW ? 'rgba(255,184,28,.15)' : 'rgba(255,255,255,.05)',
        stroke: isW ? 'rgba(255,184,28,.3)' : 'rgba(255,255,255,.08)',
        'stroke-width': '1'
      }));
      const scoreT = svgEl('text', {
        x: mx + W - 13, y: wy + 5,
        'font-size': '10', 'font-family': FONT,
        'font-weight': '800',
        fill: isW ? AMBER : 'rgba(255,255,255,.4)',
        'text-anchor': 'middle'
      });
      scoreT.textContent = score;
      tr.appendChild(scoreT);
    }

    tr.addEventListener('click', () => openModal(m.id, side));
    g.appendChild(tr);
  });

  // date
  const dateT = svgEl('text', {
    x: mx + W/2, y: my + mh2 + 10,
    'font-size': '7.5', 'text-anchor': 'middle',
    fill: 'rgba(255,255,255,.18)', 'font-family': FONT
  });
  dateT.textContent = m.date;
  g.appendChild(dateT);

  svg.appendChild(g);
}

function line(svg, x1, y1, x2, y2) {
  svg.appendChild(svgEl('line', {
    x1, y1, x2, y2,
    stroke: LINE_COLOR, 'stroke-width': '1.5',
    'stroke-dasharray': '0'
  }));
}

function updateStats() {
  const played = matches.filter(m => m.hs !== null && m.as !== null).length;
  const goals  = matches.reduce((a, m) => a + (m.hs||0) + (m.as||0), 0);
  document.getElementById('st-jugados').textContent = played;
  document.getElementById('st-goles').textContent = goals;
}

function render() {
  const svg = document.getElementById('bsvg');
  svg.innerHTML = '';

  const ROWS = 8;
  const LEFT_X   = 16;
  const H_CONN   = 60;   // connector width
  const H_TREE   = 44;   // tree connector width
  const CENTER_GAP = 80; // center trophy area

  const rightX = LEFT_X + W + H_CONN + H_TREE + CENTER_GAP + H_TREE + H_CONN;
  const centerX = LEFT_X + W + H_CONN + H_TREE + CENTER_GAP/2;
  const svgW = rightX + W + 20;

  const rowH_base = H * 2 + GAP + 16;
  const totalH = ROWS * rowH_base + 30;
  const svgH = totalH;

  svg.setAttribute('width', svgW);
  svg.setAttribute('height', svgH);
  svg.setAttribute('viewBox', `0 0 ${svgW} ${svgH}`);

  const rowH = (svgH - 40) / ROWS;

  function getMatchY(idx) {
    return 20 + idx * rowH + rowH/2 - H;
  }

  // ── LEFT COLUMN
  leftIds.forEach((id, i) => {
    const m = matches.find(x => x.id === id);
    const y = getMatchY(i);
    drawMatch(svg, m, LEFT_X, y);
    const lineX = LEFT_X + W;
    const midY = y + H;
    line(svg, lineX, midY, lineX + H_CONN, midY);
  });

  // ── RIGHT COLUMN
  rightIds.forEach((id, i) => {
    const m = matches.find(x => x.id === id);
    const y = getMatchY(i);
    drawMatch(svg, m, rightX, y);
    const lineX = rightX;
    const midY = y + H;
    line(svg, lineX - H_CONN, midY, lineX, midY);
  });

  // ── LEFT TREE CONNECTORS (pairs → 4 seeds)
  const lSeeds = [];
  for (let i = 0; i < 4; i++) {
    const top = getMatchY(i * 2) + H;
    const bot = getMatchY(i * 2 + 1) + H;
    const midY = (top + bot) / 2;
    const x1 = LEFT_X + W + H_CONN;
    const x2 = x1 + H_TREE;
    line(svg, x1, top, x1, bot);
    line(svg, x1, midY, x2, midY);
    lSeeds.push({midY, x: x2});
  }

  // ── RIGHT TREE CONNECTORS
  const rSeeds = [];
  for (let i = 0; i < 4; i++) {
    const top = getMatchY(i * 2) + H;
    const bot = getMatchY(i * 2 + 1) + H;
    const midY = (top + bot) / 2;
    const x1 = rightX - H_CONN;
    const x2 = x1 - H_TREE;
    line(svg, x1, top, x1, bot);
    line(svg, x2, midY, x1, midY);
    rSeeds.push({midY, x: x2});
  }

  // ── LEFT SEMI CONNECTORS (4→2)
  const lSemi = [];
  for (let i = 0; i < 2; i++) {
    const top = lSeeds[i*2].midY;
    const bot = lSeeds[i*2+1].midY;
    const midY = (top + bot) / 2;
    const x1 = lSeeds[i*2].x;
    const x2 = x1 + 22;
    line(svg, x1, top, x1, bot);
    line(svg, x1, midY, x2, midY);
    lSemi.push({midY, x: x2});
  }

  // ── RIGHT SEMI CONNECTORS
  const rSemi = [];
  for (let i = 0; i < 2; i++) {
    const top = rSeeds[i*2].midY;
    const bot = rSeeds[i*2+1].midY;
    const midY = (top + bot) / 2;
    const x1 = rSeeds[i*2].x;
    const x2 = x1 - 22;
    line(svg, x1, top, x1, bot);
    line(svg, x2, midY, x1, midY);
    rSemi.push({midY, x: x2});
  }

  // ── CENTER LINES TO TROPHY
  const finalMidY = (lSemi[0].midY + lSemi[1].midY) / 2;

  // left final connector
  const lFinalX = lSemi[0].x;
  line(svg, lFinalX, lSemi[0].midY, lFinalX, lSemi[1].midY);
  line(svg, lFinalX, finalMidY, centerX - 30, finalMidY);

  // right final connector
  const rFinalX = rSemi[0].x;
  line(svg, rFinalX, rSemi[0].midY, rFinalX, rSemi[1].midY);
  line(svg, centerX + 30, finalMidY, rFinalX, finalMidY);

  // ── TROPHY CENTER
  const R = 30;

  // glow effect
  const defs = svgEl('defs', {});
  const filter = svgEl('filter', {id: 'glow', x: '-50%', y: '-50%', width: '200%', height: '200%'});
  const feGaussianBlur = svgEl('feGaussianBlur', {stdDeviation: '3', result: 'blur'});
  const feMerge = svgEl('feMerge', {});
  const feMergeNode1 = svgEl('feMergeNode', {in: 'blur'});
  const feMergeNode2 = svgEl('feMergeNode', {in: 'SourceGraphic'});
  feMerge.appendChild(feMergeNode1);
  feMerge.appendChild(feMergeNode2);
  filter.appendChild(feGaussianBlur);
  filter.appendChild(feMerge);
  defs.appendChild(filter);
  svg.appendChild(defs);

  // outer ring
  svg.appendChild(svgEl('circle', {
    cx: centerX, cy: finalMidY, r: R + 8,
    fill: 'none',
    stroke: 'rgba(255,184,28,.1)',
    'stroke-width': '1',
    'stroke-dasharray': '3 4'
  }));

  // bg circle
  svg.appendChild(svgEl('circle', {
    cx: centerX, cy: finalMidY, r: R,
    fill: 'url(#trophyGrad)',
    stroke: 'rgba(255,184,28,.35)',
    'stroke-width': '1.5',
    filter: 'url(#glow)'
  }));

  // gradient def
  const grad = svgEl('radialGradient', {id: 'trophyGrad', cx: '40%', cy: '35%'});
  const s1 = svgEl('stop', {'offset': '0%', 'stop-color': '#1a3a6e'});
  const s2 = svgEl('stop', {'offset': '100%', 'stop-color': '#091420'});
  grad.appendChild(s1); grad.appendChild(s2);
  defs.appendChild(grad);

  // trophy emoji
  const trophyT = svgEl('text', {
    x: centerX, y: finalMidY - 4,
    'font-size': '22', 'text-anchor': 'middle'
  });
  trophyT.textContent = '🏆';
  svg.appendChild(trophyT);

  // FINAL label
  const finalT = svgEl('text', {
    x: centerX, y: finalMidY + 17,
    'font-size': '7', 'font-family': "'Bebas Neue', sans-serif",
    fill: AMBER, 'text-anchor': 'middle', 'letter-spacing': '2'
  });
  finalT.textContent = 'FINAL';
  svg.appendChild(finalT);

  // date
  const dateT2 = svgEl('text', {
    x: centerX, y: finalMidY + 28,
    'font-size': '6', 'font-family': FONT,
    fill: 'rgba(255,255,255,.3)', 'text-anchor': 'middle'
  });
  dateT2.textContent = '19 Jul · MetLife NJ';
  svg.appendChild(dateT2);

  updateStats();
}

// ── MODAL ────────────────────────────────────────────
function openModal(matchId, side) {
  const m = matches.find(x => x.id === matchId);
  const team = side === 'home' ? m.home : m.away;
  const score = side === 'home' ? m.hs : m.as;
  editTarget = {matchId, side};
  document.getElementById('mFlag').value  = team.f;
  document.getElementById('mName').value  = team.n;
  document.getElementById('mScore').value = score !== null ? score : '';
  document.getElementById('modal').classList.add('open');
  document.getElementById('mName').focus();
}

function closeModal() {
  document.getElementById('modal').classList.remove('open');
  editTarget = null;
}

function saveModal() {
  if (!editTarget) return;
  const {matchId, side} = editTarget;
  const m = matches.find(x => x.id === matchId);
  const flag  = document.getElementById('mFlag').value.trim() || '🏳️';
  const name  = document.getElementById('mName').value.trim();
  const score = document.getElementById('mScore').value;

  if (side === 'home') {
    m.home = {f: flag, n: name || m.home.n};
    m.hs = score !== '' ? Number(score) : null;
  } else {
    m.away = {f: flag, n: name || m.away.n};
    m.as = score !== '' ? Number(score) : null;
  }

  saveToStorage();
  closeModal();
  render();
  showToast('✓ Guardado');
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2000);
}

// close modal on overlay click
document.getElementById('modal').addEventListener('click', e => {
  if (e.target === document.getElementById('modal')) closeModal();
});

// keyboard shortcut
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeModal();
  if ((e.key === 'Enter') && document.getElementById('modal').classList.contains('open')) saveModal();
});

render();
</script>
</body>
</html>
