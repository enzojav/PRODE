<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mundial 2026 · Bracket</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0a0e1a;
      --bg2: #0f1525;
      --bg3: #141929;
      --card: #111827;
      --border: rgba(255,255,255,.06);
      --border2: rgba(108,172,228,.3);
      --text: #e8eaf2;
      --text2: rgba(255,255,255,.5);
      --text3: rgba(255,255,255,.22);
      --accent: #6CACE4;
      --amber: #FFB81C;
      --green: #3ae8b0;
      --red: #ff5b6a;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--bg); color: var(--text); font-family: 'DM Sans', sans-serif; min-height: 100vh; }

    .page-header {
      background: linear-gradient(135deg, #060d1f 0%, #0f2347 50%, #060d1f 100%);
      border-bottom: 1px solid rgba(108,172,228,.15);
      padding: 18px 24px 14px;
      display: flex; align-items: center; gap: 16px;
      position: relative; overflow: hidden;
    }
    .page-header::before {
      content:''; position:absolute; inset:0;
      background: radial-gradient(ellipse 60% 100% at 50% 0%, rgba(108,172,228,.08) 0%, transparent 70%);
      pointer-events:none;
    }
    .trophy-wrap {
      width: 48px; height: 48px;
      background: radial-gradient(circle, rgba(255,184,28,.18) 0%, rgba(255,184,28,.04) 70%);
      border: 1px solid rgba(255,184,28,.25);
      border-radius: 50%; display: flex; align-items: center; justify-content: center;
      font-size: 24px; flex-shrink: 0;
      animation: glow 2.5s ease-in-out infinite;
    }
    @keyframes glow {
      0%,100% { box-shadow: 0 0 0 0 rgba(255,184,28,0); }
      50%      { box-shadow: 0 0 18px 4px rgba(255,184,28,.2); }
    }
    .header-text .title { font-family: 'Bebas Neue', sans-serif; font-size: 1.7rem; letter-spacing: .06em; color: #fff; line-height: 1; }
    .header-text .subtitle { font-size: .68rem; color: var(--text2); letter-spacing: .12em; text-transform: uppercase; margin-top: 3px; }
    .header-badge {
      margin-left: auto;
      background: rgba(108,172,228,.1); border: 1px solid rgba(108,172,228,.2);
      border-radius: 20px; padding: 4px 12px;
      font-size: .68rem; color: var(--accent); letter-spacing: .08em;
      text-transform: uppercase; font-weight: 700;
    }

    .stats-bar { display: flex; gap: 1px; background: var(--border); border-bottom: 1px solid var(--border); }
    .stat-item { flex: 1; background: var(--bg2); padding: 10px 16px; text-align: center; }
    .stat-val { font-family: 'Bebas Neue', sans-serif; font-size: 1.3rem; color: var(--amber); letter-spacing: .04em; }
    .stat-lbl { font-size: .6rem; color: var(--text3); text-transform: uppercase; letter-spacing: .1em; margin-top: 1px; }

    .bracket-container { padding: 20px 16px; overflow-x: auto; -webkit-overflow-scrolling: touch; cursor: grab; }
    .bracket-svg { display: block; }

    .team-box { cursor: pointer; }
    .team-box rect { transition: fill .15s; }
    .team-box:hover rect:first-child { opacity: .8; }

    /* Modal */
    .modal-overlay {
      display: none; position: fixed; inset: 0;
      background: rgba(0,0,0,.75); backdrop-filter: blur(4px);
      z-index: 200; align-items: center; justify-content: center;
    }
    .modal-overlay.open { display: flex; }
    .modal-box {
      background: #131724; border: 1px solid rgba(108,172,228,.2);
      border-radius: 14px; padding: 22px; width: 320px;
      animation: slideUp .18s ease;
    }
    @keyframes slideUp { from { opacity:0; transform:translateY(12px); } to { opacity:1; transform:translateY(0); } }
    .modal-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
    .modal-title { font-size: .92rem; font-weight: 700; color: #fff; }
    .modal-close {
      width: 24px; height: 24px; background: rgba(255,255,255,.07);
      border: none; border-radius: 6px; color: var(--text2); cursor: pointer;
      font-size: 14px; display: flex; align-items: center; justify-content: center; font-family: inherit;
    }
    .modal-close:hover { background: rgba(255,255,255,.12); }

    /* Vote section inside modal */
    .vote-section { margin-bottom: 16px; }
    .vote-label { font-size: .68rem; color: var(--text2); letter-spacing: .05em; margin-bottom: 8px; display: block; }
    .vote-btns { display: flex; gap: 8px; }
    .vote-btn {
      flex: 1; padding: 10px 8px; border-radius: 8px;
      border: 1px solid rgba(255,255,255,.1);
      background: #1a1f30; color: var(--text2);
      font-size: .8rem; font-weight: 600; cursor: pointer;
      font-family: 'DM Sans', sans-serif; transition: all .15s;
      text-align: center;
    }
    .vote-btn:hover { border-color: var(--accent); color: var(--accent); }
    .vote-btn.selected { background: rgba(108,172,228,.15); border-color: var(--accent); color: var(--accent); }
    .vote-btn.confirmed { background: rgba(58,232,176,.1); border-color: var(--green); color: var(--green); }

    /* Admin result section */
    .admin-section { border-top: 1px solid rgba(255,255,255,.06); padding-top: 14px; margin-top: 4px; }
    .admin-label { font-size: .62rem; color: rgba(255,184,28,.6); letter-spacing: .1em; text-transform: uppercase; margin-bottom: 10px; display: block; }
    .score-row { display: flex; gap: 8px; align-items: center; }
    .score-inp {
      width: 60px; background: #1a1f30; border: 1px solid rgba(255,255,255,.1);
      border-radius: 8px; padding: 8px 10px; color: #fff; font-size: .9rem;
      outline: none; font-family: 'DM Sans', sans-serif; text-align: center;
      transition: border-color .15s;
    }
    .score-inp:focus { border-color: var(--amber); }
    .score-sep { color: var(--text3); font-size: 1.1rem; font-weight: 700; }
    .score-team { font-size: .75rem; color: var(--text2); flex: 1; }
    .score-team.right { text-align: right; }

    .mbtns { display: flex; gap: 8px; justify-content: flex-end; margin-top: 16px; }
    .mbtn { padding: 8px 16px; border-radius: 8px; border: none; font-size: .8rem; font-weight: 600; cursor: pointer; font-family: 'DM Sans', sans-serif; transition: opacity .15s; }
    .mbtn:hover { opacity: .85; }
    .mbtn-a { background: var(--accent); color: #fff; }
    .mbtn-amber { background: var(--amber); color: #000; }
    .mbtn-o { background: rgba(255,255,255,.07); color: var(--text2); border: 1px solid rgba(255,255,255,.1); }
    .mbtn-red { background: rgba(255,91,106,.15); color: var(--red); border: 1px solid rgba(255,91,106,.2); }

    .toast {
      position: fixed; bottom: 24px; left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: #1e2a40; border: 1px solid rgba(108,172,228,.3);
      border-radius: 10px; padding: 10px 20px;
      font-size: .8rem; color: var(--accent); font-weight: 600;
      opacity: 0; transition: all .25s; pointer-events: none; z-index: 300; white-space: nowrap;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    .toast.error { color: var(--red); border-color: rgba(255,91,106,.3); background: #1e1424; }

    .legend { display: flex; gap: 16px; padding: 0 16px 16px; flex-wrap: wrap; }
    .legend-item { display: flex; align-items: center; gap: 6px; font-size: .65rem; color: var(--text3); text-transform: uppercase; letter-spacing: .08em; }
    .legend-dot { width: 8px; height: 8px; border-radius: 2px; flex-shrink: 0; }

    .loading {
      display: flex; align-items: center; justify-content: center;
      padding: 60px; color: var(--text3); font-size: .8rem; letter-spacing: .1em;
      text-transform: uppercase;
    }
    .spinner {
      width: 20px; height: 20px; border: 2px solid rgba(108,172,228,.2);
      border-top-color: var(--accent); border-radius: 50%;
      animation: spin .7s linear infinite; margin-right: 10px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

  <div class="page-header">
    <div class="trophy-wrap">🏆</div>
    <div class="header-text">
      <div class="title">Mundial 2026</div>
      <div class="subtitle">USA · México · Canadá · 16avos de Final</div>
    </div>
    <div class="header-badge" id="live-badge">Cargando…</div>
  </div>

  <div class="stats-bar">
    <div class="stat-item">
      <div class="stat-val" id="st-partidos">16</div>
      <div class="stat-lbl">Partidos</div>
    </div>
    <div class="stat-item">
      <div class="stat-val" id="st-jugados">0</div>
      <div class="stat-lbl">Jugados</div>
    </div>
    <div class="stat-item">
      <div class="stat-val" id="st-goles">0</div>
      <div class="stat-lbl">Goles</div>
    </div>
    <div class="stat-item">
      <div class="stat-val">19 Jul</div>
      <div class="stat-lbl">Gran Final</div>
    </div>
  </div>

  <div class="bracket-container">
    <div class="loading" id="loading"><div class="spinner"></div>Cargando bracket…</div>
    <svg class="bracket-svg" id="bsvg" xmlns="http://www.w3.org/2000/svg" style="display:none"></svg>
  </div>

  <div class="legend">
    <div class="legend-item"><div class="legend-dot" style="background:rgba(255,184,28,.6)"></div>Ganador</div>
    <div class="legend-item"><div class="legend-dot" style="background:rgba(255,255,255,.2)"></div>Perdedor</div>
    <div class="legend-item"><div class="legend-dot" style="background:rgba(108,172,228,.3)"></div>Por jugar</div>
    <div class="legend-item"><div class="legend-dot" style="background:rgba(58,232,176,.5)"></div>Tu voto</div>
    <div class="legend-item" style="margin-left:auto;color:rgba(255,255,255,.3)">Toca un partido para votar</div>
  </div>

  <!-- MODAL DE VOTO / RESULTADO -->
  <div class="modal-overlay" id="modal">
    <div class="modal-box">
      <div class="modal-header">
        <div class="modal-title" id="modal-title">Partido</div>
        <button class="modal-close" onclick="closeModal()">✕</button>
      </div>

      <!-- Sección de votación (siempre visible si el partido no tiene resultado) -->
      <div class="vote-section" id="vote-section">
        <span class="vote-label">¿Quién va a ganar?</span>
        <div class="vote-btns">
          <button class="vote-btn" id="vote-home" onclick="selectVote('1')">
            <span id="vote-home-flag"></span> <span id="vote-home-name"></span>
          </button>
          <button class="vote-btn" id="vote-away" onclick="selectVote('2')">
            <span id="vote-away-flag"></span> <span id="vote-away-name"></span>
          </button>
        </div>
        <div id="vote-locked-msg" style="display:none;font-size:.72rem;color:var(--text3);margin-top:8px;text-align:center;">
          🔒 Predicción cerrada
        </div>
      </div>

      <!-- Sección admin: cargar resultado real -->
      <div class="admin-section" id="admin-section" style="display:none">
        <span class="admin-label">⚙ Cargar resultado (admin)</span>
        <div class="score-row">
          <span class="score-team" id="res-home-name">Local</span>
          <input class="score-inp" type="number" id="res-home" min="0" max="20" placeholder="0">
          <span class="score-sep">–</span>
          <input class="score-inp" type="number" id="res-away" min="0" max="20" placeholder="0">
          <span class="score-team right" id="res-away-name">Visitante</span>
        </div>
      </div>

      <div class="mbtns" id="modal-btns">
        <button class="mbtn mbtn-o" onclick="closeModal()">Cancelar</button>
        <button class="mbtn mbtn-a" id="btn-vote" onclick="submitVote()">Votar</button>
        <button class="mbtn mbtn-amber" id="btn-result" style="display:none" onclick="submitResult()">Guardar resultado</button>
        <button class="mbtn mbtn-red" id="btn-del-result" style="display:none" onclick="deleteResult()">Borrar resultado</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

<script>
// ── CONFIG ────────────────────────────────────────────────────
const W = 104, H = 36, GAP = 12;
const LINE_COLOR = 'rgba(108,172,228,.2)';
const AMBER = '#FFB81C';
const ACCENT = '#6CACE4';
const GREEN = '#3ae8b0';
const FONT = "'DM Sans', system-ui, sans-serif";

// ── STATE ─────────────────────────────────────────────────────
let matches = [];
let currentModal = null;
let selectedVote = null;
let isAdmin = false;
let isLocked = false;

// ── TOKEN (sacado del sessionStorage del sistema principal) ───
function getToken() {
  const keys = ['qh_token', 'token', 'jwt', 'authToken', 'auth_token', 'jwtToken', 'access_token'];
  for (const k of keys) {
    const v = sessionStorage.getItem(k) || localStorage.getItem(k);
    if (v && v.startsWith('ey')) return v; // JWTs siempre empiezan con "ey"
  }
  return '';
}

function getUser() {
  try {
    const t = getToken();
    if (!t) return null;
    const payload = JSON.parse(atob(t.split('.')[1]));
    return payload;
  } catch { return null; }
}

// ── API ───────────────────────────────────────────────────────
async function apiFetch(path, opts = {}) {
  const token = getToken();
  const res = await fetch(path, {
    ...opts,
    headers: {
      'Content-Type': 'application/json',
      'Authorization': token ? `Bearer ${token}` : '',
      ...(opts.headers || {})
    }
  });
  if (!res.ok) {
    const err = await res.json().catch(() => ({ error: 'Error desconocido' }));
    throw new Error(err.error || `HTTP ${res.status}`);
  }
  return res.json();
}

async function loadMatches() {
  try {
    const data = await apiFetch('/api/prode/bracket/matches');
    matches = data;
    return true;
  } catch (e) {
    // Si no hay auth, cargamos igual desde /api/prode/matches y filtramos
    try {
      const data = await apiFetch('/api/prode/matches');
      matches = data
        .filter(m => ['R16','QF','SF','F'].includes(m.phase))
        .map(m => ({ ...m, my_prediction: null }));
      return true;
    } catch { return false; }
  }
}

// ── HELPERS ───────────────────────────────────────────────────
function getWinner(m) {
  if (m.home_score === null || m.home_score === undefined) return null;
  if (m.away_score === null || m.away_score === undefined) return null;
  const h = Number(m.home_score), a = Number(m.away_score);
  return h > a ? '1' : h < a ? '2' : null;
}

function truncate(s, max) {
  if (!s) return '?';
  return s.length > max ? s.slice(0, max - 1) + '…' : s;
}

function svgEl(tag, attrs) {
  const el = document.createElementNS('http://www.w3.org/2000/svg', tag);
  for (const [k,v] of Object.entries(attrs)) el.setAttribute(k, v);
  return el;
}

function line(svg, x1, y1, x2, y2, dash = false) {
  const l = svgEl('line', { x1, y1, x2, y2, stroke: LINE_COLOR, 'stroke-width': '1.5' });
  if (dash) l.setAttribute('stroke-dasharray', '4 4');
  svg.appendChild(l);
}

// ── DRAW MATCH ────────────────────────────────────────────────
function drawMatch(svg, m, x, y) {
  if (!m) {
    // Placeholder para cuartos/semis/final vacíos
    const mx = Math.round(x), my = Math.round(y);
    const mh2 = H * 2 + 1;
    const g = svgEl('g', {});
    g.appendChild(svgEl('rect', {
      x: mx, y: my, width: W, height: mh2, rx: '7',
      fill: 'rgba(255,255,255,.02)',
      stroke: 'rgba(255,255,255,.05)', 'stroke-width': '1',
      'stroke-dasharray': '4 4'
    }));
    const t = svgEl('text', { x: mx + W/2, y: my + mh2/2 + 4, 'font-size': '9', 'text-anchor': 'middle', fill: 'rgba(255,255,255,.15)', 'font-family': FONT });
    t.textContent = 'Por definir';
    g.appendChild(t);
    svg.appendChild(g);
    return;
  }

  const winner = getWinner(m);
  const mx = Math.round(x), my = Math.round(y);
  const mh2 = H * 2 + 1;
  const myPred = m.my_prediction || null;

  const g = svgEl('g', { class: 'match-group', 'data-id': m.id, style: 'cursor:pointer' });
  g.addEventListener('click', () => openModal(m.id));

  // Shadow
  g.appendChild(svgEl('rect', { x: mx+1, y: my+2, width: W, height: mh2, rx: '7', fill: 'rgba(0,0,0,.35)' }));

  // Card bg — borde verde si el usuario ya votó
  const hasPred = myPred !== null;
  const cardStroke = winner ? 'rgba(255,184,28,.25)' : hasPred ? 'rgba(58,232,176,.3)' : 'rgba(255,255,255,.07)';
  g.appendChild(svgEl('rect', {
    x: mx, y: my, width: W, height: mh2, rx: '7',
    fill: '#0d1b38',
    stroke: cardStroke, 'stroke-width': '1'
  }));

  // Divider
  g.appendChild(svgEl('line', { x1: mx+1, y1: my+H, x2: mx+W-1, y2: my+H, stroke: 'rgba(255,255,255,.05)', 'stroke-width': '1' }));

  // Indicador de voto (pequeño dot verde en esquina)
  if (hasPred && !winner) {
    g.appendChild(svgEl('circle', { cx: mx + W - 6, cy: my + 6, r: '3', fill: 'rgba(58,232,176,.7)' }));
  }

  [
    { name: m.home, flag: m.home_flag || '🏳️', score: m.home_score, side: '1', wy: my + H/2 },
    { name: m.away, flag: m.away_flag || '🏳️', score: m.away_score, side: '2', wy: my + H + H/2 },
  ].forEach(({ name, flag, score, side, wy }) => {
    const isW = winner === side;
    const isL = winner && winner !== side;
    const isPredWinner = !winner && myPred === side;

    const tr = svgEl('g', {});

    // Highlight bar
    if (isW) {
      tr.appendChild(svgEl('rect', { x: mx, y: wy - H/2, width: W, height: H, rx: side === '1' ? '7' : '0', fill: 'rgba(255,184,28,.07)' }));
      tr.appendChild(svgEl('rect', { x: mx, y: wy - H/2, width: 3, height: H, rx: '2', fill: 'rgba(255,184,28,.6)' }));
    } else if (isPredWinner) {
      tr.appendChild(svgEl('rect', { x: mx, y: wy - H/2, width: W, height: H, rx: side === '1' ? '7' : '0', fill: 'rgba(58,232,176,.05)' }));
      tr.appendChild(svgEl('rect', { x: mx, y: wy - H/2, width: 3, height: H, rx: '2', fill: 'rgba(58,232,176,.5)' }));
    } else {
      tr.appendChild(svgEl('rect', { x: mx, y: wy - H/2, width: W, height: H, rx: side === '1' ? '7' : '0', fill: 'rgba(0,0,0,0)' }));
    }

    // Flag
    const flagT = svgEl('text', { x: mx+9, y: wy+5, 'font-size': '12' });
    flagT.textContent = flag;
    tr.appendChild(flagT);

    // Name
    const nameT = svgEl('text', {
      x: mx+27, y: wy+5,
      'font-size': '10', 'font-family': FONT,
      'font-weight': (isW || isPredWinner) ? '700' : '400',
      fill: isW ? AMBER : isPredWinner ? GREEN : isL ? 'rgba(255,255,255,.25)' : 'rgba(255,255,255,.8)'
    });
    nameT.textContent = truncate(name || '?', 9);
    tr.appendChild(nameT);

    // Score
    if (score !== null && score !== undefined) {
      tr.appendChild(svgEl('rect', {
        x: mx + W - 22, y: wy - 9, width: 18, height: 17, rx: '4',
        fill: isW ? 'rgba(255,184,28,.15)' : 'rgba(255,255,255,.05)',
        stroke: isW ? 'rgba(255,184,28,.3)' : 'rgba(255,255,255,.08)', 'stroke-width': '1'
      }));
      const scoreT = svgEl('text', {
        x: mx + W - 13, y: wy + 5,
        'font-size': '10', 'font-family': FONT, 'font-weight': '800',
        fill: isW ? AMBER : 'rgba(255,255,255,.4)', 'text-anchor': 'middle'
      });
      scoreT.textContent = score;
      tr.appendChild(scoreT);
    }

    g.appendChild(tr);
  });

  // Date label
  if (m.match_date || m.time) {
    const dateT = svgEl('text', {
      x: mx + W/2, y: my + mh2 + 10,
      'font-size': '7.5', 'text-anchor': 'middle',
      fill: 'rgba(255,255,255,.18)', 'font-family': FONT
    });
    dateT.textContent = (m.match_date || '') + (m.time ? ' · ' + m.time + 'hs' : '');
    g.appendChild(dateT);
  }

  svg.appendChild(g);
}

// ── RENDER ────────────────────────────────────────────────────
const leftIds  = [200,201,202,203,204,205,206,207];
const rightIds = [208,209,210,211,212,213,214,215];

function updateStats() {
  const played = matches.filter(m => m.home_score !== null && m.home_score !== undefined).length;
  const goals  = matches.reduce((a, m) => a + (Number(m.home_score)||0) + (Number(m.away_score)||0), 0);
  document.getElementById('st-jugados').textContent = played;
  document.getElementById('st-goles').textContent = goals;
  document.getElementById('live-badge').textContent = played > 0 ? 'En vivo' : 'Próximamente';
}

function render() {
  const svg = document.getElementById('bsvg');
  svg.innerHTML = '';

  // Dimensiones
  const CW = 110, CH = 36; // card width/height por equipo (total card = CH*2+1)
  const GAP = 10;           // gap entre las 2 cards de un par
  const CONN = 28;          // conector horizontal
  const TOP = 40;
  const ROWS = 8;           // 8 pares de R16

  // IDs por ronda
  const R16L  = [200,201,202,203,204,205,206,207];
  const R16R  = [208,209,210,211,212,213,214,215];
  const QFL   = [216,217,218,219];
  const QFR   = [220,221,222,223];
  const SFL   = [224,225];
  const SFR   = [226,227];
  const FIN   = [228];

  // Altura de una card completa (2 equipos)
  const CARD_H = CH * 2 + 1;
  // Altura de una fila de R16
  const ROW_H = CARD_H + GAP + 20; // +20 para fecha
  const SVG_H = TOP + ROWS * ROW_H + 60;

  // Columnas
  const C_R16L = 12;
  const C_QFL  = C_R16L + CW + CONN;
  const C_SFL  = C_QFL  + CW + CONN;
  const C_FIN  = C_SFL  + CW + CONN;
  const C_SFR  = C_FIN  + CW + CONN;
  const C_QFR  = C_SFR  + CW + CONN;
  const C_R16R = C_QFR  + CW + CONN;
  const SVG_W  = C_R16R + CW + 12;

  svg.setAttribute('width', SVG_W);
  svg.setAttribute('height', SVG_H);
  svg.setAttribute('viewBox', `0 0 ${SVG_W} ${SVG_H}`);
  svg.style.minWidth = SVG_W + 'px';

  // Fondo
  const bg = svgEl('rect', { x:0, y:0, width:SVG_W, height:SVG_H, fill:'#070d1e', rx:'10' });
  svg.appendChild(bg);

  // Etiquetas
  const labels = [
    { x: C_R16L + CW/2, t: '16AVOS'  },
    { x: C_QFL  + CW/2, t: '8AVOS'   },
    { x: C_SFL  + CW/2, t: 'CUARTOS' },
    { x: C_FIN  + CW/2, t: 'FINAL'   },
    { x: C_SFR  + CW/2, t: 'CUARTOS' },
    { x: C_QFR  + CW/2, t: '8AVOS'   },
    { x: C_R16R + CW/2, t: '16AVOS'  },
  ];
  labels.forEach(({ x, t }) => {
    const el = svgEl('text', { x, y: TOP - 14, 'font-size': '9',
      'text-anchor': 'middle', fill: 'rgba(255,255,255,.4)',
      'font-family': FONT, 'font-weight': '700', 'letter-spacing': '1.5' });
    el.textContent = t;
    svg.appendChild(el);
  });

  // Y position de cada fila de R16
  function rowY(i) { return TOP + i * ROW_H; }
  // midY de una card en fila i
  function rowMidY(i) { return rowY(i) + CARD_H / 2; }

  // ── Dibujar partido ──────────────────────────────────────
  function drawMatch(m, x, y) {
    const winner = m ? getWinner(m) : null;
    const myPred = m?.my_prediction || null;
    const hasPred = myPred !== null;
    const hasResult = m && m.home_score !== null && m.home_score !== undefined;

    const g = svgEl('g', m ? { style: 'cursor:pointer' } : {});
    if (m) g.addEventListener('click', () => openModal(m.id));

    // Sombra
    g.appendChild(svgEl('rect', { x: x+1, y: y+2, width: CW, height: CARD_H, rx: '7', fill: 'rgba(0,0,0,.4)' }));

    // Fondo
    const stroke = hasResult ? 'rgba(255,184,28,.3)' : hasPred ? 'rgba(58,232,176,.3)' : 'rgba(255,255,255,.07)';
    g.appendChild(svgEl('rect', { x, y, width: CW, height: CARD_H, rx: '7',
      fill: '#0d1b38', stroke, 'stroke-width': '1' }));

    // Divisor
    g.appendChild(svgEl('line', { x1: x+1, y1: y+CH, x2: x+CW-1, y2: y+CH,
      stroke: 'rgba(255,255,255,.05)', 'stroke-width': '1' }));

    if (!m) {
      const t = svgEl('text', { x: x+CW/2, y: y+CARD_H/2+4,
        'font-size': '8', 'text-anchor': 'middle',
        fill: 'rgba(255,255,255,.12)', 'font-family': FONT });
      t.textContent = '?';
      g.appendChild(t);
      svg.appendChild(g);
      return { midY: y + CARD_H/2 };
    }

    [
      { name: m.home, flag: m.home_flag||'🏳️', score: m.home_score, side:'1', oy: y + CH/2 },
      { name: m.away, flag: m.away_flag||'🏳️', score: m.away_score, side:'2', oy: y + CH + CH/2 },
    ].forEach(({ name, flag, score, side, oy }) => {
      const isW = winner === side;
      const isL = winner && winner !== side;
      const isPred = !winner && myPred === side;

      if (isW) {
        g.appendChild(svgEl('rect', { x, y: oy-CH/2, width: 3, height: CH, rx:'2', fill:'rgba(255,184,28,.7)' }));
      } else if (isPred) {
        g.appendChild(svgEl('rect', { x, y: oy-CH/2, width: 3, height: CH, rx:'2', fill:'rgba(58,232,176,.7)' }));
      }

      const ft = svgEl('text', { x: x+8, y: oy+4, 'font-size': '11' });
      ft.textContent = flag;
      g.appendChild(ft);

      const nt = svgEl('text', { x: x+24, y: oy+4,
        'font-size': '9', 'font-family': FONT,
        'font-weight': (isW||isPred) ? '700' : '400',
        fill: isW ? AMBER : isPred ? GREEN : isL ? 'rgba(255,255,255,.25)' : 'rgba(255,255,255,.8)' });
      nt.textContent = truncate(name||'?', 9);
      g.appendChild(nt);

      if (score !== null && score !== undefined) {
        g.appendChild(svgEl('rect', { x: x+CW-20, y: oy-8, width:16, height:16, rx:'3',
          fill: isW?'rgba(255,184,28,.15)':'rgba(255,255,255,.05)',
          stroke: isW?'rgba(255,184,28,.3)':'rgba(255,255,255,.08)', 'stroke-width':'1' }));
        const st = svgEl('text', { x: x+CW-12, y: oy+4,
          'font-size':'9', 'font-family':FONT, 'font-weight':'800',
          'text-anchor':'middle', fill: isW?AMBER:'rgba(255,255,255,.4)' });
        st.textContent = score;
        g.appendChild(st);
      }

      if (hasPred && !winner) {
        g.appendChild(svgEl('circle', { cx: x+CW-5, cy: y+5, r:'3', fill:'rgba(58,232,176,.7)' }));
      }
    });

    if (m.match_date) {
      const dt = svgEl('text', { x: x+CW/2, y: y+CARD_H+10,
        'font-size':'7', 'text-anchor':'middle',
        fill:'rgba(255,255,255,.2)', 'font-family':FONT });
      dt.textContent = m.match_date + (m.time?' · '+m.time+'hs':'');
      g.appendChild(dt);
    }

    svg.appendChild(g);
    return { midY: y + CARD_H/2 };
  }

  // ── Línea horizontal ────────────────────────────────────
  function hline(x1, x2, y, color) {
    const l = svgEl('line', { x1, y1:y, x2, y2:y,
      stroke: color||'rgba(108,172,228,.2)', 'stroke-width':'1' });
    svg.appendChild(l);
  }
  function vline(x, y1, y2, color) {
    const l = svgEl('line', { x1:x, y1, x2:x, y2,
      stroke: color||'rgba(108,172,228,.2)', 'stroke-width':'1' });
    svg.appendChild(l);
  }

  // ── Dibujar R16 y recolectar midYs ──────────────────────
  const midYsL = [], midYsR = [];

  R16L.forEach((id, i) => {
    const m = matches.find(x => x.id === id);
    const y = rowY(i);
    const r = drawMatch(m||null, C_R16L, y);
    midYsL.push(r.midY);
    hline(C_R16L + CW, C_QFL, r.midY);
  });

  R16R.forEach((id, i) => {
    const m = matches.find(x => x.id === id);
    const y = rowY(i);
    const r = drawMatch(m||null, C_R16R, y);
    midYsR.push(r.midY);
    hline(C_QFR + CW, C_R16R, r.midY);
  });

  // ── QF (8avos) ──────────────────────────────────────────
  const midYsQFL = [], midYsQFR = [];

  QFL.forEach((id, i) => {
    const top = midYsL[i*2];
    const bot = midYsL[i*2+1];
    const midY = (top+bot)/2;
    vline(C_QFL, top, bot);
    const m = matches.find(x => x.id === id);
    const y = midY - CARD_H/2;
    const r = drawMatch(m||null, C_QFL, y);
    midYsQFL.push(r.midY);
    hline(C_QFL + CW, C_SFL, r.midY);
  });

  QFR.forEach((id, i) => {
    const top = midYsR[i*2];
    const bot = midYsR[i*2+1];
    const midY = (top+bot)/2;
    vline(C_QFR, top, bot);
    const m = matches.find(x => x.id === id);
    const y = midY - CARD_H/2;
    const r = drawMatch(m||null, C_QFR, y);
    midYsQFR.push(r.midY);
    hline(C_SFR + CW, C_QFR, r.midY);
  });

  // ── SF (cuartos) ─────────────────────────────────────────
  const midYsSFL = [], midYsSFR = [];

  SFL.forEach((id, i) => {
    const top = midYsQFL[i*2];
    const bot = midYsQFL[i*2+1];
    const midY = (top+bot)/2;
    vline(C_SFL, top, bot);
    const m = matches.find(x => x.id === id);
    const y = midY - CARD_H/2;
    const r = drawMatch(m||null, C_SFL, y);
    midYsSFL.push(r.midY);
    hline(C_SFL + CW, C_FIN, r.midY);
  });

  SFR.forEach((id, i) => {
    const top = midYsQFR[i*2];
    const bot = midYsQFR[i*2+1];
    const midY = (top+bot)/2;
    vline(C_SFR, top, bot);
    const m = matches.find(x => x.id === id);
    const y = midY - CARD_H/2;
    const r = drawMatch(m||null, C_SFR, y);
    midYsSFR.push(r.midY);
    hline(C_FIN + CW, C_SFR, r.midY);
  });

  // ── Final ────────────────────────────────────────────────
  const finMidY = (midYsSFL[0] + midYsSFL[1] + midYsSFR[0] + midYsSFR[1]) / 4;
  vline(C_FIN, midYsSFL[0], midYsSFL[1]);
  vline(C_FIN + CW, midYsSFR[0], midYsSFR[1]);

  const finM = matches.find(x => x.id === 228);
  const finY = finMidY - CARD_H/2;
  drawMatch(finM||null, C_FIN, finY);

  // Trophy
  const tT = svgEl('text', { x: C_FIN + CW/2, y: finY - 12,
    'font-size':'18', 'text-anchor':'middle' });
  tT.textContent = '🏆';
  svg.appendChild(tT);

  updateStats();
}

// ── MODAL ─────────────────────────────────────────────────────
function openModal(matchId) {
  const m = matches.find(x => x.id === matchId);
  if (!m) return;

  currentModal = m;
  selectedVote = m.my_prediction || null;
  isLocked = false;

  // Check lock time
  try {
    const parts = (m.match_date || '').split(' ');
    const MONTH_MAP = { Ene:0,Feb:1,Mar:2,Abr:3,May:4,Jun:5,Jul:6,Ago:7,Sep:8,Oct:9,Nov:10,Dic:11 };
    const day = parseInt(parts[1]);
    const month = MONTH_MAP[parts[2]];
    const [hh, mm] = (m.time || '00:00').split(':').map(Number);
    const matchTime = new Date(Date.UTC(2026, month, day, hh + 3, mm, 0));
    const lockTime = new Date(matchTime.getTime() - 60 * 60 * 1000);
    if (new Date() >= lockTime) isLocked = true;
  } catch {}

  const hasResult = m.home_score !== null && m.home_score !== undefined;

  // Title
  document.getElementById('modal-title').textContent =
    `${m.home_flag || '🏳️'} ${m.home || '?'} vs ${m.away_flag || '🏳️'} ${m.away || '?'}`;

  // Vote section
  const voteSection = document.getElementById('vote-section');
  const lockedMsg = document.getElementById('vote-locked-msg');
  const voteHome = document.getElementById('vote-home');
  const voteAway = document.getElementById('vote-away');

  document.getElementById('vote-home-flag').textContent = m.home_flag || '🏳️';
  document.getElementById('vote-home-name').textContent = truncate(m.home || '?', 10);
  document.getElementById('vote-away-flag').textContent = m.away_flag || '🏳️';
  document.getElementById('vote-away-name').textContent = truncate(m.away || '?', 10);

  voteHome.className = 'vote-btn';
  voteAway.className = 'vote-btn';

  if (hasResult) {
    voteSection.style.display = 'none';
  } else {
    voteSection.style.display = 'block';
    if (isLocked) {
      lockedMsg.style.display = 'block';
      voteHome.disabled = true; voteAway.disabled = true;
    } else {
      lockedMsg.style.display = 'none';
      voteHome.disabled = false; voteAway.disabled = false;
    }
    if (selectedVote === '1') voteHome.className = 'vote-btn confirmed';
    if (selectedVote === '2') voteAway.className = 'vote-btn confirmed';
  }

  // Admin section
  const adminSection = document.getElementById('admin-section');
  const btnResult = document.getElementById('btn-result');
  const btnDelResult = document.getElementById('btn-del-result');
  const btnVote = document.getElementById('btn-vote');

  if (isAdmin) {
    adminSection.style.display = 'block';
    document.getElementById('res-home-name').textContent = truncate(m.home || '?', 10);
    document.getElementById('res-away-name').textContent = truncate(m.away || '?', 10);
    document.getElementById('res-home').value = hasResult ? m.home_score : '';
    document.getElementById('res-away').value = hasResult ? m.away_score : '';
    btnResult.style.display = '';
    btnDelResult.style.display = hasResult ? '' : 'none';
  } else {
    adminSection.style.display = 'none';
    btnResult.style.display = 'none';
    btnDelResult.style.display = 'none';
  }

  // Ocultar botón votar si hay resultado o está bloqueado
  btnVote.style.display = (hasResult || isLocked) ? 'none' : '';

  document.getElementById('modal').classList.add('open');
}

function closeModal() {
  document.getElementById('modal').classList.remove('open');
  currentModal = null; selectedVote = null;
}

function selectVote(side) {
  if (isLocked) return;
  selectedVote = side;
  document.getElementById('vote-home').className = side === '1' ? 'vote-btn selected' : 'vote-btn';
  document.getElementById('vote-away').className = side === '2' ? 'vote-btn selected' : 'vote-btn';
}

async function submitVote() {
  if (!currentModal || !selectedVote) { showToast('Seleccioná un ganador primero', true); return; }
  try {
    await apiFetch('/api/prode/bracket/vote', {
      method: 'POST',
      body: JSON.stringify({ match_id: currentModal.id, result: selectedVote })
    });
    // Actualizar estado local
    const idx = matches.findIndex(m => m.id === currentModal.id);
    if (idx !== -1) matches[idx].my_prediction = selectedVote;
    showToast('✓ Voto guardado');
    closeModal();
    render();
  } catch (e) {
    showToast(e.message, true);
  }
}

async function submitResult() {
  if (!currentModal) return;
  const h = document.getElementById('res-home').value;
  const a = document.getElementById('res-away').value;
  if (h === '' || a === '') { showToast('Completá ambos goles', true); return; }
  if (Number(h) === Number(a)) { showToast('No puede haber empate en eliminatoria', true); return; }
  try {
    const updated = await apiFetch(`/api/prode/bracket/matches/${currentModal.id}/result`, {
      method: 'PUT',
      body: JSON.stringify({ home_score: Number(h), away_score: Number(a) })
    });
    const idx = matches.findIndex(m => m.id === currentModal.id);
    if (idx !== -1) matches[idx] = { ...matches[idx], ...updated };
    showToast('✓ Resultado guardado');
    closeModal();
    render();
  } catch (e) {
    showToast(e.message, true);
  }
}

async function deleteResult() {
  if (!currentModal) return;
  if (!confirm('¿Borrar el resultado de este partido?')) return;
  try {
    const updated = await apiFetch(`/api/prode/bracket/matches/${currentModal.id}/result`, { method: 'DELETE' });
    const idx = matches.findIndex(m => m.id === currentModal.id);
    if (idx !== -1) matches[idx] = { ...matches[idx], ...updated };
    showToast('✓ Resultado borrado');
    closeModal();
    render();
  } catch (e) {
    showToast(e.message, true);
  }
}

function showToast(msg, error = false) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show' + (error ? ' error' : '');
  setTimeout(() => t.className = 'toast', 2500);
}

// Close modal on overlay click / Escape
document.getElementById('modal').addEventListener('click', e => {
  if (e.target === document.getElementById('modal')) closeModal();
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeModal();
});

// ── INIT ─────────────────────────────────────────────────────
async function init() {
  // Detectar rol via API (más confiable que parsear el JWT)
  try {
    const me = await apiFetch('/api/prode/me');
    isAdmin = me.role === 'admin';
  } catch {
    // Fallback: parsear JWT manualmente
    const user = getUser();
    if (user) {
      isAdmin = user.role === 'admin' || user.isAdmin === true;
    }
  }

  const ok = await loadMatches();
  document.getElementById('loading').style.display = 'none';
  document.getElementById('bsvg').style.display = 'block';

  if (!ok) {
    showToast('No se pudieron cargar los partidos', true);
    return;
  }
  render();
}

init();
</script>
